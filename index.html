<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Copa | A New Home for Football</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --text-main: #ffffff;
      --text-muted: #86868b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
    }

    /* Subtle background glow for depth */
    .bg-glow {
      position: absolute;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Top Navigation Bar */
    .site-nav {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 1rem;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
    }

    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      transition: color 0.2s ease;
    }

    .nav-link:hover {
      color: var(--text-main);
    }

    /* Main Hero Layout */
    .hero-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: 1rem 1.5rem 5rem;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hero-content {
      max-width: 680px;
    }

    /* Bold Hero Logo */
    .hero-logo {
      display: block;
      width: 100%;
      max-width: 320px;
      height: auto;
      margin-bottom: 2.5rem;
      filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.08));
    }

    .kicker {
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: clamp(2.75rem, 6vw, 4.5rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      color: #ffffff;
    }

    .sub {
      color: var(--text-muted);
      font-size: clamp(1.1rem, 2vw, 1.35rem);
      line-height: 1.5;
      font-weight: 400;
      margin-bottom: 2.5rem;
    }

    .sub strong {
      color: var(--text-main);
      font-weight: 500;
    }

    /* Actions */
    .cta-row {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    .app-store-badge {
      display: inline-block;
      height: 52px;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
    }

    .app-store-badge:hover {
      transform: scale(1.02);
      opacity: 0.95;
    }

    .app-store-badge svg {
      height: 100%;
      width: auto;
      display: block;
    }

    /* Footer */
    .site-footer {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    @media (max-width: 640px) {
      .hero-logo {
        max-width: 220px;
        margin-bottom: 2rem;
      }
      .site-footer {
        flex-direction: column;
        gap: 1rem;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <div class="bg-glow" aria-hidden="true"></div>

  <header class="site-nav">
    <nav class="nav-links">
      <a href="mailto:hq@getcopa.com?subject=COPA%20Handle%20Request&body=Username:%20" class="nav-link">Contact</a>
      <a href="privacy.html" class="nav-link">Privacy</a>
    </nav>
  </header>

  <main class="hero-container">
    <section class="hero-content">
      <img src="assets/logo.png" alt="Copa Logo" class="hero-logo" />

      <p class="kicker">EST. 2026</p>

      <h1>A NEW HOME FOR FOOTBALL.</h1>

      <p class="sub">
        No algorithms. No farming. No noise.<br>
        <strong>Pure banter. Real takes. Old FT reclaimed.</strong>
      </p>

      <div class="cta-row">
        <a
          href="https://apps.apple.com/us/app/copa-hq/id6760593390"
          target="_blank"
          rel="noopener noreferrer"
          class="app-store-badge"
          aria-label="Download Copa HQ on the App Store"
        >
          <svg viewBox="0 0 162 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="162" height="48" rx="8" fill="black"/>
            <path d="M22.023 20.308C22.003 16.96 24.743 15.228 24.862 15.15C23.303 12.871 20.877 12.536 20.038 12.502C18.001 12.292 16.032 13.712 14.992 13.712C13.939 13.712 12.33 12.516 10.638 12.548C8.423 12.582 6.375 13.842 5.234 15.828C2.894 19.888 4.636 25.882 6.906 29.176C8.033 30.787 9.349 32.587 11.08 32.523C12.766 32.455 13.407 31.439 15.441 31.439C17.447 31.439 18.04 32.523 19.8 32.489C21.602 32.455 22.748 30.842 23.856 29.219C25.154 27.324 25.68 25.485 25.71 25.385C25.666 25.367 22.046 23.978 22.023 20.308Z" fill="white"/>
            <path d="M18.427 10.741C19.351 9.613 19.98 8.053 19.805 6.5C18.463 6.555 16.793 7.4 15.828 8.528C14.966 9.529 14.204 11.118 14.411 12.639C15.91 12.755 17.491 11.879 18.427 10.741Z" fill="white"/>
            <text x="50" y="18" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="500" letter-spacing="0.2">Download on the</text>
            <text x="50" y="32" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="-0.2">App Store</text>
            <rect x="0.5" y="0.5" width="161" height="47" rx="7.5" stroke="#A6A6A6" stroke-opacity="0.6"/>
          </svg>
        </a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Copa. All rights reserved.</p>
    <p>Built for fans.</p>
  </footer>

</body>
</html>
