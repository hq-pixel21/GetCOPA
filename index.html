<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#000000" />
  <title>Copa | A New Home for Football</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Layout Overrides */
    .hero-content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      justify-content: center;
      min-height: 90vh;
      padding-top: 2rem;
    }

    .hero-logo {
      display: block;
      margin-left: auto;
      margin-right: auto;
      margin-bottom: 5rem; /* Large gap between big logo and text */
      width: 100%;
      max-width: 400px;    /* INCREASED SIZE HERE */
      height: auto;
      filter: drop-shadow(0 0 20px rgba(255,255,255,0.05)); /* Subtle depth */
    }

    @media (max-width: 768px) {
      .hero-logo {
        max-width: 280px;  /* Slightly smaller for mobile screens */
        margin-bottom: 3rem;
      }
    }

    .cta-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 1.5rem;
    }

    /* Shared Button Styling across all 3 CTAs */
    .cta-btn {
      height: 48px;
      min-width: 162px;
      padding: 0 1.25rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid rgba(166, 166, 166, 0.6);
      background: black;
      color: #ffffff;
      text-decoration: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      transition: opacity 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
    }

    .cta-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
      border-color: rgba(255, 255, 255, 0.9);
    }

    /* SVG Sizing inside the App Store CTA */
    .cta-btn-appstore {
      padding: 0;
      border: none; /* SVG contains its own border and background */
      background: transparent;
    }

    .cta-btn-appstore svg {
      height: 100%;
      width: auto;
      display: block;
    }
  </style>
</head>

<body>

  <main class="hero" aria-label="Copa homepage">
    <div class="hero-media" aria-hidden="true"></div>
    <div class="hero-wash" aria-hidden="true"></div>

    <section class="hero-content container">
      <img src="assets/logo.png" alt="Copa Logo" class="hero-logo" />

      <p class="kicker">EST. 2026</p>

      <h1>A NEW HOME FOR FOOTBALL.</h1>

      <p class="sub">
        No algorithms. No farming. No noise.<br>
        Pure banter. Real takes.<br>
        Old FT. Reclaimed.
      </p>

      <div class="cta-row" role="group" aria-label="Primary actions">
        <a
          href="https://apps.apple.com/us/app/copa-hq/id6760593390"
          target="_blank"
          rel="noopener noreferrer"
          class="cta-btn cta-btn-appstore"
          aria-label="Download Copa HQ on the App Store"
        >
          <svg viewBox="0 0 162 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="162" height="48" rx="8" fill="black"/>
            <path d="M22.023 20.308C22.003 16.96 24.743 15.228 24.862 15.15C23.303 12.871 20.877 12.536 20.038 12.502C18.001 12.292 16.032 13.712 14.992 13.712C13.939 13.712 12.33 12.516 10.638 12.548C8.423 12.582 6.375 13.842 5.234 15.828C2.894 19.888 4.636 25.882 6.906 29.176C8.033 30.787 9.349 32.587 11.08 32.523C12.766 32.455 13.407 31.439 15.441 31.439C17.447 31.439 18.04 32.523 19.8 32.489C21.602 32.455 22.748 30.842 23.856 29.219C25.154 27.324 25.68 25.485 25.71 25.385C25.666 25.367 22.046 23.978 22.023 20.308Z" fill="white"/>
            <path d="M18.427 10.741C19.351 9.613 19.98 8.053 19.805 6.5C18.463 6.555 16.793 7.4 15.828 8.528C14.966 9.529 14.204 11.118 14.411 12.639C15.91 12.755 17.491 11.879 18.427 10.741Z" fill="white"/>
            <text x="50" y="18" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="500" letter-spacing="0.2">Download on the</text>
            <text x="50" y="32" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="-0.2">App Store</text>
            <rect x="0.5" y="0.5" width="161" height="47" rx="7.5" stroke="#A6A6A6" stroke-opacity="0.6"/>
          </svg>
        </a>

        <a
          href="mailto:hq@getcopa.com?subject=COPA%20Handle%20Request&body=Username:%20"
          class="cta-btn"
        >
          CONTACT ME
        </a>

        <a
          href="privacy.html"
          class="cta-btn"
        >
          PRIVACY POLICY
        </a>
      </div>
    </section>
  </main>

</body>
</html>
